name: FX Speech Verification

# Runs the exhaustive parameter matrix against Kokoro-generated speech instead
# of the synthetic probes. One shard per effect, same matrix as fx-verify.yml.
#
#   speech     - generate tools/fxverify/fixtures/kokoro_speech_48k_f32.wav
#   dsp-speech - every effect x every parameter, rendered on the speech probes
#   summary    - merge the per-effect verdicts into one report

on:
  workflow_dispatch:
    inputs:
      skip_generation:
        description: 'Reuse the committed Kokoro fixture instead of generating it'
        type: boolean
        default: false

permissions:
  contents: read

env:
  FX_PROBE_OVERRIDE: speech

jobs:
  speech:
    if: ${{ !inputs.skip_generation }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro and audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet kokoro soundfile numpy
      - name: Generate the speech fixture
        run: python3 tools/fxverify/generate_kokoro_speech.py
      - name: Show the fixture
        run: |
          ls -lh tools/fxverify/fixtures/kokoro_speech_48k_f32.wav
          python3 - <<'EOF'
          import soundfile as sf
          i = sf.info('tools/fxverify/fixtures/kokoro_speech_48k_f32.wav')
          print(i)
          assert i.samplerate == 48000 and i.channels == 1
          EOF
      - name: Upload the speech fixture
        uses: actions/upload-artifact@v4
        with:
          name: fx-speech-fixture
          path: tools/fxverify/fixtures/kokoro_speech_48k_f32.wav
          if-no-files-found: error
          retention-days: 30

  dsp-speech:
    needs: speech
    if: ${{ always() && (needs.speech.result == 'success' || inputs.skip_generation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        effect: [noise, deess, comp, hpf, presence, warmth, gate, limiter,
                 eq6, geq, fcurve, basstreble, highpass, lowpass, notch, shelf,
                 classic, amplify, normalize, loudness, dyncomp, mbcomp,
                 bricklim, gateexp, deesssplit, autoduck, specnr, declick,
                 clipfix, repair, dehum, plosive, reverb, multidelay, echo,
                 stereoimg, distort, phaser, chorus, tremolo, wah, vocoder,
                 changepitch, tempo, speedpitch, slidestretch, paulstretch,
                 fade, timeline, truncsil, spectraledit, generator]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Kokoro speech fixture
        uses: actions/download-artifact@v4
        with:
          name: fx-speech-fixture
          path: tools/fxverify/fixtures
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Render every parameter of ${{ matrix.effect }} on speech
        env:
          FX_EFFECT: ${{ matrix.effect }}
        run: |
          chmod +x ./gradlew
          status=1
          for i in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest \
                --tests '*FxParamMatrixDumpTest' --stacktrace; then
              echo "shard $FX_EFFECT passed on attempt $i"
              status=0
              break
            fi
            echo "shard $FX_EFFECT failed on attempt $i; retrying"
            sleep 15
          done
          echo "TEST_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Measure the speech renders
        run: |
          python3 -m pip install --quiet numpy
          python3 tools/fxverify/analyze.py \
            --cases "app/build/fxverify/${{ matrix.effect }}" \
            --compact --skip-anchors
      - name: Upload speech metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-speech-metrics-${{ matrix.effect }}
          path: |
            app/build/fxverify/${{ matrix.effect }}/verdicts.json
            app/build/fxverify/${{ matrix.effect }}/metrics.json
            app/build/fxverify/${{ matrix.effect }}/cases.json
            app/build/fxverify/${{ matrix.effect }}/anomalies/
          if-no-files-found: ignore
          retention-days: 14

  summary:
    needs: dsp-speech
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every effect's verdicts
        uses: actions/download-artifact@v4
        with:
          pattern: fx-speech-metrics-*
          path: speech-metrics
      - name: Merge the report
        run: |
          python3 tools/fxverify/speech_summary.py \
            --root speech-metrics \
            --report speech-metrics/REPORT.md \
            --json-out speech-metrics/summary.json
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-speech-report
          path: speech-metrics/
          if-no-files-found: ignore
          retention-days: 30
