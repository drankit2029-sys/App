name: Play Store Screenshots

# Ads-free listing screenshots at the sizes Play asks for, one job per
# device class. The tour suppresses ads (Pro entitlement + automated-test
# short-circuit), seeds a realistic populated library, and captures composed
# screens (library, studio, FX rack, teleprompter) without UI fuzz.

on:
  workflow_dispatch:
  push:
    branches-ignore: [master, main]
    paths:
      - 'app/src/androidTest/java/com/takeone/studio/PlayStoreScreenshotTest.java'
      - 'tools/ui-screens/run_store_screens.sh'
      - '.github/workflows/store-screenshots.yml'

concurrency:
  group: store-screens-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-apks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Build debug and instrumentation APKs
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Upload APK pair
        uses: actions/upload-artifact@v4
        with:
          name: store-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  screenshots:
    needs: build-apks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: compact_phone_720x1280, api: 34, width: 720, height: 1280, density: 240, orientation: portrait }
          - { id: normal_phone_1080x2400, api: 34, width: 1080, height: 2400, density: 420, orientation: portrait }
          - { id: tablet_7in_1200x1920, api: 34, width: 1200, height: 1920, density: 280, orientation: portrait }
          - { id: tablet_10in_1600x2560, api: 34, width: 1600, height: 2560, density: 320, orientation: landscape }
    env:
      APK_PATH: outputs/debug/app-debug.apk
      TEST_APK_PATH: outputs/androidTest/debug/app-debug-androidTest.apk
      DEVICE_ID: ${{ matrix.id }}
      UI_WIDTH: ${{ matrix.width }}
      UI_HEIGHT: ${{ matrix.height }}
      UI_DENSITY: ${{ matrix.density }}
      UI_ORIENTATION: ${{ matrix.orientation }}
      UI_CLASS: com.takeone.studio.PlayStoreScreenshotTest
      UI_ARG: storeScreensDevice
    steps:
      - uses: actions/checkout@v4
      - name: Download APK pair
        uses: actions/download-artifact@v4
        with:
          name: store-apks
          path: outputs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the listing screenshot tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: 'Nexus 5'
          disable-animations: true
          emulator-options: >-
            -no-window -no-snapshot -gpu swiftshader_indirect
            -no-boot-anim -camera-back none
          script: |
            set -e
            bash tools/ui-screens/run_store_screens.sh
      - name: Upload listing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screens-${{ matrix.id }}
          path: store-screens/${{ matrix.id }}/
          if-no-files-found: warn
      - name: Upload instrumentation log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: store-screens-log-${{ matrix.id }}
          path: |
            store-screens/${{ matrix.id }}/instrumentation.txt
            store-screens/${{ matrix.id }}/device-info.txt
          if-no-files-found: ignore
