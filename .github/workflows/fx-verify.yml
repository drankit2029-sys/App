name: FX Parameter Verification

# Exhaustive verification of the effects rack:
#   params        - the runtime parameter inventory (and a drift guard)
#   dsp-matrix    - one job per effect: every parameter rendered off-device
#   fx-ui-device  - one job per effect: the real UI driven on an emulator,
#                   screen-recorded, screenshots at every parameter value
#   format-matrix - the uploaded clip converted into every container
#   analyze       - merges everything into one report

on:
  workflow_dispatch:
    inputs:
      smoke_only:
        description: 'Run only the single-effect smoke check (validates capture)'
        type: boolean
        default: false
      skip_dsp:
        description: 'Skip the off-device parameter matrix'
        type: boolean
        default: false
      skip_device:
        description: 'Skip the emulator sweep and the format matrix'
        type: boolean
        default: false
      keep_all_wavs:
        description: 'Upload every rendered WAV from the DSP matrix (large)'
        type: boolean
        default: false
      speech:
        description: 'Render the DSP matrix on Kokoro-generated speech probes'
        type: boolean
        default: false
      skip_speech_generation:
        description: 'Reuse the committed Kokoro speech fixture'
        type: boolean
        default: false
  push:
    branches: [verify/fx-matrix]
    paths:
      - 'app/src/**'
      - 'tools/fxverify/**'
      - '.github/workflows/fx-verify.yml'

concurrency:
  group: fx-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.takeone.studio.debug

jobs:
  params:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Inventory every effect parameter
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --tests '*FxParamInventoryTest' --stacktrace
      - name: Check the workflow matrix against the catalog
        run: |
          python3 -m pip install --quiet numpy
          python3 tools/fxverify/selftest.py
          python3 tools/fxverify/check_drift.py
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: fx-params
          path: app/build/fxverify/params/
          if-no-files-found: error
          retention-days: 14

  build:
    if: ${{ !inputs.speech }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Build the app and instrumentation APKs
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fx-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  speech:
    if: ${{ inputs.speech }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Kokoro and audio tools
        if: ${{ !inputs.skip_speech_generation }}
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet kokoro soundfile numpy
      - name: Generate the speech fixture
        if: ${{ !inputs.skip_speech_generation }}
        run: python3 tools/fxverify/generate_kokoro_speech.py
      - name: Verify the committed fixture
        if: ${{ inputs.skip_speech_generation }}
        run: test -f tools/fxverify/fixtures/kokoro_speech_48k_f32.wav
      - name: Show the fixture
        run: |
          ls -lh tools/fxverify/fixtures/kokoro_speech_48k_f32.wav
          python3 - <<'EOF'
          import soundfile as sf
          i = sf.info('tools/fxverify/fixtures/kokoro_speech_48k_f32.wav')
          print(i)
          assert i.samplerate == 48000 and i.channels == 1
          EOF
      - name: Upload the speech fixture
        uses: actions/upload-artifact@v4
        with:
          name: fx-speech-fixture
          path: tools/fxverify/fixtures/kokoro_speech_48k_f32.wav
          if-no-files-found: error
          retention-days: 30

  dsp-matrix:
    needs: [params, speech]
    if: ${{ always() && !cancelled() && needs.params.result == 'success'
            && !inputs.skip_dsp && !inputs.smoke_only
            && (!inputs.speech || needs.speech.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        effect: [noise, deess, comp, hpf, presence, warmth, gate, limiter,
                 eq6, geq, fcurve, basstreble, highpass, lowpass, notch, shelf,
                 classic, amplify, normalize, loudness, dyncomp, mbcomp,
                 bricklim, gateexp, deesssplit, autoduck, specnr, declick,
                 clipfix, repair, dehum, plosive, reverb, multidelay, echo,
                 stereoimg, distort, phaser, chorus, tremolo, wah, vocoder,
                 changepitch, tempo, speedpitch, slidestretch, paulstretch,
                 fade, timeline, truncsil, spectraledit, generator]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Kokoro speech fixture
        if: ${{ inputs.speech }}
        uses: actions/download-artifact@v4
        with:
          name: fx-speech-fixture
          path: tools/fxverify/fixtures
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Render every parameter of ${{ matrix.effect }}
        env:
          FX_EFFECT: ${{ matrix.effect }}
          FX_PROBE_OVERRIDE: ${{ inputs.speech && 'speech' || '' }}
        run: |
          chmod +x ./gradlew
          # Robolectric fetches its android-all jar at test time, outside the
          # Gradle cache; retry as the repo's other test steps do.
          for i in 1 2 3; do
            if ./gradlew :app:testDebugUnitTest --tests '*FxParamMatrixDumpTest' --stacktrace; then
              echo "shard $FX_EFFECT passed on attempt $i"; exit 0
            fi
            echo "shard $FX_EFFECT failed on attempt $i; retrying"
            sleep 15
          done
          exit 1
      - name: Measure the renders
        run: |
          python3 -m pip install --quiet numpy
          python3 tools/fxverify/analyze.py --cases "app/build/fxverify/${{ matrix.effect }}" --compact ${{ inputs.speech && '--skip-anchors' || '' }}
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-metrics-${{ matrix.effect }}
          path: |
            app/build/fxverify/${{ matrix.effect }}/verdicts.json
            app/build/fxverify/${{ matrix.effect }}/metrics.json
            app/build/fxverify/${{ matrix.effect }}/cases.json
            app/build/fxverify/${{ matrix.effect }}/anomalies/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload every render
        if: ${{ always() && inputs.keep_all_wavs }}
        uses: actions/upload-artifact@v4
        with:
          name: fx-renders-${{ matrix.effect }}
          path: |
            app/build/fxverify/${{ matrix.effect }}/wet/
            app/build/fxverify/${{ matrix.effect }}/dry/
          if-no-files-found: ignore
          retention-days: 7

  fx-ui-device:
    needs: [params, build]
    # Emulator jobs are opt-in, as in verify.yml: a push runs the JVM tiers only.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_device && !inputs.smoke_only && !inputs.speech }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        effect: [noise, deess, comp, hpf, presence, warmth, gate, limiter,
                 eq6, geq, fcurve, basstreble, highpass, lowpass, notch, shelf,
                 classic, amplify, normalize, loudness, dyncomp, mbcomp,
                 bricklim, gateexp, deesssplit, autoduck, specnr, declick,
                 clipfix, repair, dehum, plosive, reverb, multidelay, echo,
                 stereoimg, distort, phaser, chorus, tremolo, wah, vocoder,
                 changepitch, tempo, speedpitch, slidestretch, paulstretch,
                 fade, timeline, truncsil, spectraledit, generator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fx-apks
          path: apks
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive ${{ matrix.effect }} through the real UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -memory 3072
          script: |
            adb shell settings put global stay_on_while_plugged_in 3
            # A background launcher ANR freezes the whole display and every
            # capture with it, so keep system error dialogs off the screen and
            # stop the launcher we never use (the test starts the activity).
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global window_animation_scale 0
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell input keyevent 82 || true
            adb install -r -t "$(find apks -name 'app-debug.apk' | head -1)"
            adb install -r -t "$(find apks -name 'app-debug-androidTest.apk' | head -1)"
            mkdir -p fx-out
            for attempt in 1 2 3; do adb wait-for-device; timeout 1200 adb shell am instrument -w -e class com.example.hello.FxPanelDialDeviceTest -e fxEffect "${{ matrix.effect }}" "$(adb shell pm list instrumentation | grep AndroidJUnitRunner | head -1 | sed 's/.*instrumentation://; s/ .*//' | tr -d '\r')" > fx-out/instrumentation.txt 2>&1; grep -q "OK (" fx-out/instrumentation.txt && break; echo "attempt $attempt did not report OK"; sleep 15; done
            cat fx-out/instrumentation.txt
            adb pull "/sdcard/Android/data/$APP_ID/files/takes/fxverify-${{ matrix.effect }}" fx-out/ || true
            adb shell logcat -d -v brief > fx-out/logcat-full.txt || true
            grep -q "OK (" fx-out/instrumentation.txt || { echo "instrumentation did not report OK"; exit 1; }
      - name: Upload the sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-video-${{ matrix.effect }}
          path: fx-out/
          if-no-files-found: warn
          retention-days: 14

  format-matrix:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_device && !inputs.smoke_only && !inputs.speech }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fx-apks
          path: apks
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Convert the uploaded clip into every container
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -memory 3072
          script: |
            adb shell settings put global stay_on_while_plugged_in 3
            # A background launcher ANR freezes the whole display and every
            # capture with it, so keep system error dialogs off the screen and
            # stop the launcher we never use (the test starts the activity).
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global window_animation_scale 0
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb install -r -t "$(find apks -name 'app-debug.apk' | head -1)"
            adb install -r -t "$(find apks -name 'app-debug-androidTest.apk' | head -1)"
            mkdir -p fx-formats
            for attempt in 1 2 3; do adb wait-for-device; adb shell am instrument -w -e class com.example.hello.FormatMatrixDeviceTest "$(adb shell pm list instrumentation | grep AndroidJUnitRunner | head -1 | sed 's/.*instrumentation://; s/ .*//' | tr -d '\r')" > fx-formats/instrumentation.txt 2>&1; grep -q "OK (" fx-formats/instrumentation.txt && break; echo "attempt $attempt did not report OK"; sleep 15; done
            cat fx-formats/instrumentation.txt
            adb pull "/sdcard/Android/data/$APP_ID/files/takes/fxverify-formats" fx-formats/ || true
            grep -q "OK (" fx-formats/instrumentation.txt || { echo "instrumentation did not report OK"; exit 1; }
      - name: Verify the containers independently
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet numpy
          python3 tools/fxverify/verify_formats.py --dir fx-formats/fxverify-formats
      - name: Upload the converted files and the verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-formats
          path: fx-formats/fxverify-formats/
          if-no-files-found: warn
          retention-days: 14

  smoke:
    needs: build
    if: ${{ inputs.smoke_only && !inputs.speech }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fx-apks
          path: apks
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke check one effect (capture, video, screenshots)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none -memory 3072
          script: |
            adb shell settings put global stay_on_while_plugged_in 3
            # A background launcher ANR freezes the whole display and every
            # capture with it, so keep system error dialogs off the screen and
            # stop the launcher we never use (the test starts the activity).
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put global window_animation_scale 0
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb install -r -t "$(find apks -name 'app-debug.apk' | head -1)"
            adb install -r -t "$(find apks -name 'app-debug-androidTest.apk' | head -1)"
            mkdir -p smoke
            for attempt in 1 2 3; do adb wait-for-device; timeout 1200 adb shell am instrument -w -e class com.example.hello.FxPanelDialDeviceTest -e fxEffect hpf "$(adb shell pm list instrumentation | grep AndroidJUnitRunner | head -1 | sed 's/.*instrumentation://; s/ .*//' | tr -d '\r')" > smoke/instrumentation.txt 2>&1; grep -q "OK (" smoke/instrumentation.txt && break; echo "attempt $attempt did not report OK"; sleep 15; done
            cat smoke/instrumentation.txt
            adb pull "/sdcard/Android/data/$APP_ID/files/takes/fxverify-hpf" smoke/ || true
            adb shell ls -l "/sdcard/Android/data/$APP_ID/files/takes/fxverify-hpf" > smoke/files.txt 2>&1 || true
            cat smoke/files.txt
            adb shell logcat -d -v brief > smoke/logcat-full.txt || true
            grep -E "FATAL|ANR in|ActivityManager: Start proc" smoke/logcat-full.txt | tail -20 || true
            grep -q "OK (" smoke/instrumentation.txt || { echo "smoke check failed"; exit 1; }
      - name: Upload the smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-smoke
          path: smoke/
          if-no-files-found: warn
          retention-days: 7

  analyze:
    needs: [params, dsp-matrix, fx-ui-device, format-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Install analysis dependencies
        run: python3 -m pip install --quiet numpy
      - name: Verify the applied audio per parameter
        if: ${{ !inputs.speech }}
        run: python3 tools/fxverify/verify_applied.py --root artifacts
      - name: Merge the verdicts into one report
        if: ${{ !inputs.speech }}
        run: |
          mkdir -p fx-report
          python3 tools/fxverify/aggregate_report.py --root artifacts \
            --report fx-report/REPORT.md --json-out fx-report/combined.json || true
          cat fx-report/REPORT.md
      - name: Merge the speech verdicts
        if: ${{ inputs.speech }}
        run: |
          mkdir -p fx-report
          python3 tools/fxverify/speech_summary.py --root artifacts \
            --report fx-report/SPEECH.md --json-out fx-report/speech-summary.json
          cat fx-report/SPEECH.md
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fx-report
          path: fx-report/
          if-no-files-found: warn
          retention-days: 14
