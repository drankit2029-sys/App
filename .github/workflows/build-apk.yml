name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK packages
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        # Robolectric downloads its android-all jar at test time, outside
        # Gradle's cache, so a flaky Maven response fails the whole suite with
        # MavenArtifactFetcher/FileNotFoundException noise unrelated to the
        # code. Retry: the fetch is cached after the first success.
        run: |
          for i in 1 2 3; do
            if ./gradlew testDebugUnitTest --stacktrace; then
              echo "unit tests passed on attempt $i"; exit 0
            fi
            echo "unit tests failed on attempt $i; retrying"
            sleep 15
          done
          echo "unit tests still failing after 3 attempts"
          exit 1

      - name: Compile on-device (instrumentation) tests
        # The androidTest source set is not built by the unit-test or
        # assembleDebug tasks, so a broken on-device test would otherwise
        # only surface when someone runs it on a real device/emulator.
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Run lint
        timeout-minutes: 15
        # Diagnostic wrapper: while lintAnalyzeDebug runs (it can hang),
        # snapshot jstack of every JVM so a hung analysis still yields the
        # spinning detector's stack in the lint-report artifact.
        run: |
          ./gradlew lintDebug --stacktrace &
          GRADLE_PID=$!
          mkdir -p lint-jstack
          for t in 60 120 180 240 300; do
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            sleep 60
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            for p in $(jps -q 2>/dev/null || true); do
              jstack "$p" > "lint-jstack/jstack-${t}s-p${p}.txt" 2>&1 || true
            done
          done
          wait "$GRADLE_PID"

      - name: Print lint errors
        if: failure()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          t = ET.parse('app/build/reports/lint-results-debug.xml')
          for issue in t.getroot().iter('issue'):
              if issue.get('severity') == 'Error':
                  locs = [l.get('file', '') + ':' + l.get('line', '?')
                          for l in issue.iter('location')]
                  print(issue.get('id'), '|', issue.get('message', '')[:160])
                  for l in locs:
                      print('   at', l)
          EOF

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            lint-jstack/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK output
        if: always()
        run: ls -lh app/build/outputs/apk/debug/ || echo "No APK dir found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release App Bundle (.aab)
        env:
          TAKEONE_KEYSTORE_PASSWORD: ${{ secrets.TAKEONE_KEYSTORE_PASSWORD }}
          TAKEONE_KEY_ALIAS: ${{ secrets.TAKEONE_KEY_ALIAS }}
          TAKEONE_KEY_PASSWORD: ${{ secrets.TAKEONE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Release App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

  # The interesting regressions in this app (RecyclerView stable-id swaps,
  # the conversion service queue, the streaming encoder handoff) only show up
  # on a device, so the instrumentation suite runs here too.
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: |
            adb emu avd hostmicon
            adb emu avd rewindaudio || true
            adb shell settings put global stay_on_while_plugged_in 3
            adb shell input keyevent 82 || true
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Summarise instrumentation results
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for p in glob.glob('app/build/outputs/androidTest-results/connected/debug/*.xml'):
              r = ET.parse(p).getroot()
              total += int(r.get('tests', 0))
              failed += int(r.get('failures', 0)) + int(r.get('errors', 0))
              skipped += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  for x in list(tc):
                      if x.tag in ('failure', 'error'):
                          print('FAIL:', tc.get('classname', '').split('.')[-1],
                              '::', tc.get('name'), '::', (x.get('message') or '')[:200])
          print('device tests:', total, 'failures:', failed, 'skipped:', skipped)
          EOF

      - name: Upload instrumentation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: app/build/outputs/androidTest-results/connected/
