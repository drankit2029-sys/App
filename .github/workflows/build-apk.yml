name: Build Debug APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK packages
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Print lint errors
        if: failure()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          t = ET.parse('app/build/reports/lint-results-debug.xml')
          for issue in t.getroot().iter('issue'):
              if issue.get('severity') == 'Error':
                  locs = [l.get('file', '') + ':' + l.get('line', '?')
                          for l in issue.iter('location')]
                  print(issue.get('id'), '|', issue.get('message', '')[:160])
                  for l in locs:
                      print('   at', l)
          EOF

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK output
        if: always()
        run: ls -lh app/build/outputs/apk/debug/ || echo "No APK dir found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
